<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3529"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quaki">
<title>Quaki – dein Zuhause für gute Tage</title>
<style>
:root{
  --bg:#f4efe4; --card:#fffdf8; --ink:#3f332c; --mut:#7d6e63;
  --pink:#ee96ad; --mint:#94cca9; --sun:#f5cf64; --lav:#c5b7eb; --line:#e5dbc8;
  --moss-deep:#192e22; --moss-mid:#2c4a38; --moss-light:#5c8549;
  color-scheme:light; box-sizing:border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--moss-deep);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
button:active{transform:scale(.96)}
button.p{background:linear-gradient(180deg,#ffadc2,#e87f9b);color:#4f1626;font-weight:700;box-shadow:0 4px 12px rgba(232,127,155,.35)}
button.y{background:linear-gradient(180deg,#ffe48f,#f0c248);color:#473100;font-weight:800;box-shadow:0 4px 12px rgba(240,194,72,.35)}
button.g{background:linear-gradient(180deg,#3c634b,#284533);color:#fff8e8;font-weight:700}
button.rb{width:40px;height:40px;padding:0;font-size:17px;background:rgba(255,253,248,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(25,35,28,.18);border:1.5px solid rgba(255,255,255,.85)}
button.wide{width:100%;margin-top:10px}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:20px;padding:9px 14px;min-width:0}
input,select{border-radius:999px}
.card{background:rgba(255,253,248,.94);border:1.5px solid rgba(255,255,255,.92);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(45,38,28,.09)}
.card h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:14px}

/* 360°-Welt */
.world{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;background:linear-gradient(180deg,#1a3325 0%,#2d5239 58%,#1e3a24 100%)}
.world::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 65px rgba(10,20,14,.45)}
.pano-track{position:absolute;top:0;bottom:0;left:0;width:960vw;display:flex;will-change:transform;z-index:1}
.pano-tile{width:320vw;height:100%;flex:none;position:relative}
.pano-hit{position:absolute;cursor:pointer;z-index:4;border-radius:28px}
.pano-tag{position:absolute;transform:translateX(-50%);background:rgba(34,54,42,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,245,200,.45);padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;color:#fff8e6;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}

/* Glühwürmchen */
.firefly-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6b3;box-shadow:0 0 10px 3px rgba(255,240,150,.85);animation:ffFloat 6s ease-in-out infinite}
@keyframes ffFloat{0%,100%{transform:translate(0,0) scale(.8);opacity:.35}50%{transform:translate(12px,-18px) scale(1.2);opacity:1}}

/* Topbar & HUD */
.tb{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.lv{background:rgba(255,253,248,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;border-radius:20px;padding:5px 12px;font-size:12.5px;box-shadow:0 4px 14px rgba(20,30,24,.18)}
.mini{height:5px;background:rgba(63,51,44,.14);border-radius:4px;margin-top:3px;width:78px}.mini i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4e8232);border-radius:4px}
.pts{background:linear-gradient(180deg,#ffe89e,#f2c64d);border:1.5px solid #fff;color:#473100;border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(20,30,24,.2)}

.room-pill{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(36,48,38,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,245,215,.4);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:#fff7e6;z-index:8;white-space:nowrap}
.room-pill button{padding:2px 6px;font-size:12px;background:transparent;color:#ffe48f;font-weight:800}

.bubble{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(255,253,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;border-radius:22px;padding:8px 16px;font-weight:800;font-size:13px;box-shadow:0 8px 20px rgba(20,30,24,.22);max-width:84%;text-align:center;line-height:1.3;z-index:7;cursor:pointer}
.bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0;border-style:solid;border-color:rgba(255,253,248,.95) transparent transparent}

/* Quaki 3D-Bühne */
.qk-stage{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:clamp(130px,22vh,165px);height:clamp(142px,24vh,180px);z-index:5;cursor:pointer;touch-action:manipulation;perspective:750px}
.qk-ground-shadow{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:96px;height:18px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(10,20,10,.65) 0%,rgba(10,20,10,0) 76%);pointer-events:none;z-index:1}
.qk-3d-wrap{position:relative;z-index:2;width:100%;height:100%;transform-origin:50% 94%;animation:qk3dIdle 4.2s ease-in-out infinite}
@keyframes qk3dIdle{0%,100%{transform:rotateY(-3deg) translateY(0)}50%{transform:rotateY(3deg) translateY(-4px)}}
@keyframes qk3dHop{0%{transform:translateY(0) scale(1)}25%{transform:translateY(6px) scale(1.08,.9)}55%{transform:translateY(-26px) scale(.95,1.06)}100%{transform:translateY(0) scale(1)}}
.qk-3d-wrap.hop3d{animation:qk3dHop .65s cubic-bezier(.25,.9,.35,1.2)!important}
.qk-wear-layer{position:absolute;inset:0;pointer-events:none;z-index:3}

/* 3D Möbel & Draußen-Deko */
.f3d-item{position:absolute;transform:translate(-50%,-86%) scale(var(--dscale,1));cursor:grab;display:flex;flex-direction:column;align-items:center;z-index:4}
.f3d-item:active{cursor:grabbing;z-index:25!important}
.f3d-model{width:88px;height:88px;filter:drop-shadow(0 10px 8px rgba(18,12,8,.45));pointer-events:none}
.dc3d{position:absolute;width:68px;height:68px;transform:translate(-50%,-50%);cursor:pointer;z-index:4;filter:drop-shadow(0 8px 10px rgba(12,24,14,.5));transition:transform .2s}
.dc3d:active{transform:translate(-50%,-58%) scale(1.12)}

/* Garten-Beete */
.garden-canvas{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#426b36 0%,#264521 60%,#182e16 100%);overflow:hidden;user-select:none;touch-action:none}
.bed3d{position:absolute;transform:translate(-50%,-50%) scale(var(--bscale,1));cursor:grab;z-index:4;display:flex;flex-direction:column;align-items:center}
.bed3d:active{cursor:grabbing;z-index:15}
.bed3d-box{position:relative;width:152px;height:106px;pointer-events:none}
.bed3d-crops{position:absolute;inset:10px 14px 22px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;font-size:26px;line-height:1}
.bed3d-tag{margin-top:-6px;background:rgba(30,48,36,.88);border:1px solid rgba(255,245,200,.45);color:#fff8e6;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;white-space:nowrap}
.bed3d-water{position:absolute;top:-4px;right:2px;background:#2997ff;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}

/* Dock Leiste */
.dock{position:fixed;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-around;z-index:17;pointer-events:none;max-width:480px;margin:0 auto}
.dock button{pointer-events:auto}
body.sheet-open .dock,body.sheet-open .deco-drawer{opacity:0!important;pointer-events:none!important;transform:translateY(120%)!important}
.plus{width:60px;height:60px;border-radius:50%;padding:0;font-size:32px;background:linear-gradient(180deg,#ffadc2,#e87896);color:#fff;box-shadow:0 8px 20px rgba(180,60,95,.45),inset 0 2px 0 rgba(255,255,255,.7);flex:none}
.dock-btn{width:52px;height:52px;border-radius:18px;padding:3px 0;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;box-shadow:0 6px 16px rgba(20,30,24,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.dock-btn span{font-size:9px;font-weight:800;color:var(--ink);margin-top:2px}
.dock-btn i{position:absolute;top:-4px;right:-4px;background:#ff5c7c;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

/* Einrichtungs-Schublade */
.deco-drawer{position:fixed;left:0;right:0;bottom:0;height:64%;max-height:92%;background:linear-gradient(180deg,#faf5ea 0%,#efe5d3 100%);border-radius:30px 30px 0 0;border-top:2px solid #fff;z-index:19;box-shadow:0 -10px 30px rgba(25,20,15,.28);display:flex;flex-direction:column;max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),height .28s;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
.deco-drawer.on{transform:none}
.deco-drawer.expanded{height:92%;padding-bottom:24px}
.deco-drag-bar{width:48px;height:5px;border-radius:999px;background:#cbbba8;margin:8px auto 2px;cursor:ns-resize}
.deco-tabs{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.deco-tabs::-webkit-scrollbar{display:none}
.deco-tabs button{flex:none;padding:7px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}
.deco-grid{flex:1;overflow:auto;padding:12px 16px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.deco-card{background:rgba(255,253,248,.95);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(60,45,30,.08)}
.deco-card.owned{border-color:var(--mint);background:#f2faf5}
.deco-card.worn{border-color:var(--pink);background:#fff0f4}

/* Vollbild-Sheets im Mossy-Design */
.shb{position:fixed;inset:0;background:rgba(25,20,15,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:14}.shb.on{opacity:1;pointer-events:auto}
.sh{position:fixed;inset:0;height:100%;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:radial-gradient(circle at 15% 10%,rgba(168,214,122,.22),transparent 45%),linear-gradient(180deg,#f3ecde 0%,#e7dcc8 100%);z-index:16;display:flex;flex-direction:column}
.sh.on{transform:none}
.sht{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(180deg,#2d4737 0%,#213629 100%);color:#fff8e8;font-size:20px;font-weight:800;border-bottom:2px solid rgba(255,245,200,.25)}
.sht .rb{width:auto;padding:0 14px;height:36px;font-size:13.5px;font-weight:800;background:rgba(255,253,248,.94);color:#263b2e}
#sc{overflow:auto;max-width:580px;width:100%;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px));flex:1}

/* UI Bausteine */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:linear-gradient(180deg,#cdebd8,#9fd1b2);color:#163d29;font-weight:700;border:1px solid rgba(255,255,255,.8)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(229,219,200,.5)}
.chk:last-child{border-bottom:0}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--pink);background:#fff;padding:0;flex:none;font-size:16px;line-height:1;color:#fff}.dot.on{background:var(--pink)}
.sq{width:22px;height:22px;accent-color:#4e8232;flex:none}
.seg{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,253,248,.75);padding:5px;border-radius:999px;border:1.5px solid rgba(255,255,255,.9)}
.seg button{flex:1;background:transparent;font-weight:800;font-size:13.5px;padding:8px 12px}
.seg button.p{background:linear-gradient(180deg,#3c634b,#284533)!important;color:#fff8e8!important;box-shadow:0 4px 10px rgba(32,56,41,.28)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.mc{min-height:54px;background:rgba(255,253,248,.92);border-radius:16px;padding:5px;text-align:center;font-size:14px;cursor:pointer;border:1.5px solid rgba(255,255,255,.9)}
.mc.td{outline:2.5px solid #5c9442;background:#f4faef}
.mc.sel{background:linear-gradient(180deg,#ffe799,#f2c955);color:#3f2b00;font-weight:800}
.mc.o{opacity:.35}
.dts{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:3px}.dts i{width:7px;height:7px;border-radius:50%;background:#5c9442}
.clean-hero{background:linear-gradient(135deg,#d8f2e5,#fff0c2);border-radius:24px;padding:16px;margin-bottom:14px;border:1.5px solid #fff}
.habit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.habit-row:last-child{border-bottom:0}
.wdots{display:flex;gap:4px}.wdot{width:15px;height:15px;border-radius:50%;background:var(--line);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--mut)}.wdot.on{background:#8ec9a4;color:#17422d;font-weight:800}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(16,26,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.ov>div{background:linear-gradient(180deg,#fbf7ee 0%,#f0e6d4 100%);border:2px solid rgba(255,255,255,.92);border-radius:30px;padding:22px 20px;width:100%;max-width:400px;max-height:88%;overflow:auto;text-align:center;box-shadow:0 24px 48px rgba(14,24,18,.42)}
.ov h2{color:#263b2e;margin-top:0}
.am{display:grid;gap:8px}.am button{text-align:left;padding:14px 18px;background:rgba(255,253,248,.92)}
.breathe{width:90px;height:90px;border-radius:50%;background:var(--sun);margin:14px auto;animation:br 8s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#263b2e;color:#fff8e8;padding:10px 18px;border-radius:999px;z-index:30;font-weight:700;max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.28)}
</style></head><body>
<main id="m"></main>
<div class="dock" id="dock"></div>
<div class="deco-drawer" id="deco-drawer"></div>
<div class="shb" id="shb" onclick="closeS()"></div>
<div class="sh" id="sh"><div class="sht"><span id="sht"></span><button class="rb" onclick="closeS()">← Zurück</button></div><div id="sc"></div></div>
<div id="ov"></div><div id="ts"></div>
<input type="file" id="inp-backup" accept=".json,.txt,application/json" style="display:none" onchange="importBackupFile(this.files[0])">
<script>
const KEY='quaki_mossy_v5';
const todayStr=()=>new Date().toISOString().slice(0,10);

const DEFAULT_STATE={
  pts:45, xp:120, lv:2,
  scene:'out',
  roomIdx:0,
  panoX:0,
  decoOpen:false, decoExpanded:false, decoTab:'furn',
  owned:['hat','flow','mate'],
  worn:['hat'],
  rooms:[
    {name:'Wohnzimmer',wall:'#e9dcc4',floor:'#8c6239',items:[
      {id:'f1',t:'Sessel',x:28,y:74},{id:'f2',t:'Tisch',x:52,y:78},{id:'f3',t:'Pflanze',x:78,y:70}
    ]},
    {name:'Schlafzimmer',wall:'#dce4d4',floor:'#7a5434',items:[
      {id:'f4',t:'Bett',x:35,y:74},{id:'f5',t:'Lampe',x:72,y:68}
    ]}
  ],
  beds:[
    {id:'b1',n:'Kräuter-Beet',x:30,y:44,crops:['🌿','🌱','🌼'],water:true},
    {id:'b2',n:'Beeren-Ecke',x:68,y:52,crops:['🍓','🫐','🍓'],water:false},
    {id:'b3',n:'Blumen-Insel',x:48,y:72,crops:['🌸','🌻','🌷'],water:true}
  ],
  tasks:[
    {id:'t1',txt:'1 Glas Wasser trinken',done:true,date:todayStr(),time:'09:00',cat:'Alltag'},
    {id:'t2',txt:'10 Min frische Luft schnappen',done:false,date:todayStr(),time:'14:30',cat:'Wohlbefinden'},
    {id:'t3',txt:'Lieblingsmusik anmachen',done:false,date:todayStr(),time:'18:00',cat:'Pause'}
  ],
  habits:[
    {id:'h1',n:'Wasser getrunken 💧',days:[1,1,1,1,0,1,0]},
    {id:'h2',n:'Kurz bewegt 🌿',days:[1,0,1,1,1,0,0]},
    {id:'h3',n:'Pausen gegönnt 💛',days:[1,1,0,1,1,1,0]}
  ],
  calTab:'day', selDate:todayStr(), curSheet:null
};

let S=loadState();
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE),JSON.parse(raw));
  }catch(e){return structuredClone(DEFAULT_STATE);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function gain(n){
  S.pts+=n; S.xp+=n*10;
  while(S.xp>=S.lv*100){S.xp-=S.lv*100;S.lv++;}
  save(); renderTop();
  return n;
}
function toast(msg){
  const el=document.getElementById('ts');
  el.innerHTML=`<div class="toast">${msg}</div>`;
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>el.innerHTML='',2600);
}
function ov(html){
  const el=document.getElementById('ov');
  el.innerHTML=html?`<div class="ov" onclick="if(event.target===this)ov()"><div>${html}</div></div>`:'';
}

function quaki3dSvg(){
  return `<svg viewBox="0 0 200 220" width="100%" height="100%" style="overflow:visible">
    <defs>
      <radialGradient id="qBody" cx="38%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff8c9"/><stop offset="55%" stop-color="#f7d560"/><stop offset="100%" stop-color="#d49e2a"/>
      </radialGradient>
      <radialGradient id="qBeak" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffb86c"/><stop offset="100%" stop-color="#e06d24"/>
      </radialGradient>
      <radialGradient id="qCheek" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff8fa8" stop-opacity="0.75"/><stop offset="100%" stop-color="#ff8fa8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="78" cy="202" rx="18" ry="8" fill="#e67e22"/>
    <ellipse cx="122" cy="202" rx="18" ry="8" fill="#e67e22"/>
    <ellipse cx="100" cy="148" rx="54" ry="52" fill="url(#qBody)"/>
    <ellipse cx="100" cy="154" rx="36" ry="34" fill="#fffbe0" opacity="0.55"/>
    <ellipse cx="46" cy="146" rx="15" ry="28" transform="rotate(14 46 146)" fill="#ecc146"/>
    <ellipse cx="154" cy="146" rx="15" ry="28" transform="rotate(-14 154 146)" fill="#ecc146"/>
    <circle cx="100" cy="78" r="44" fill="url(#qBody)"/>
    <path d="M96 34 Q90 18 102 24 Q112 16 108 35" fill="#f7d560" stroke="#d49e2a" stroke-width="2"/>
    <circle cx="82" cy="74" r="6.5" fill="#2b211a"/><circle cx="80" cy="72" r="2.2" fill="#fff"/>
    <circle cx="118" cy="74" r="6.5" fill="#2b211a"/><circle cx="116" cy="72" r="2.2" fill="#fff"/>
    <circle cx="68" cy="86" r="10" fill="url(#qCheek)"/>
    <circle cx="132" cy="86" r="10" fill="url(#qCheek)"/>
    <ellipse cx="100" cy="88" rx="16" ry="9" fill="url(#qBeak)"/>
    <path d="M88 88 Q100 94 112 88" stroke="#b54d12" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function quakiWornOverlaySvg(){
  const w=S.worn||[];
  if(!w.length)return '';
  let parts='';
  if(w.includes('hat')){

const QUOTES=[
  'Schön, dass du da bist 💛 Kein Stress heute!',
  'Ein kleiner Schritt reicht schon völlig aus 🌱',
  'Quaki passt gut auf dein Moos-Zuhause auf 🦆',

  'Wisch nach links oder rechts, um die Lichtung zu erkunden ✨'
];

function renderTop(){
  const need=S.lv*100;
  const pct=Math.min(100,Math.round((S.xp/need)*100));
  return `<div class="tb">
    <div class="lv"><b>Level ${S.lv}</b> · Quaki<div class="mini"><i style="width:${pct}%"></i></div></div>
    <div class="row">
      <button class="rb" title="Backup & Info" onclick="openSheet('shop')">⚙️</button>
      <div class="pts">⭐ ${S.pts}</div>
    </div>
  </div>`;
}

function renderWorld(){
  const m=document.getElementById('m');
  if(S.scene==='garden'){renderGarden();return;}
  if(S.scene==='room'){renderRoom();return;}

  const o=id=>S.owned.includes(id);
  const ffHtml=Array.from({length:12},(_,i)=>`<i class="ff" style="left:${(i*17+9)%94}%;top:${(i*23+14)%62}%;animation-delay:${(i*0.6)%5}s"></i>`).join('');

  m.innerHTML=`<div class="world" id="world">
    ${renderTop()}
    <div class="room-pill">🌲 Moos-Waldlichtung · <button onclick="setScene('room')">🏠 Ins Zimmer</button> · <button onclick="setScene('garden')">🌱 Garten</button></div>
    <div class="bubble" onclick="sayNew()">${window._qMsg||QUOTES[0]}</div>

    <div class="pano-track" id="pano" style="transform:translateX(${S.panoX}px)">
      ${[0,1,2].map(()=>`<div class="pano-tile">
        ${forestPanoTileSvg()}
        <div class="pano-hit" style="left:28%;top:48%;width:16%;height:24%" onclick="setScene('room')">
          <div class="pano-tag" style="left:50%;top:-14px">🏠 Gemütliches Zimmer</div>
        </div>
        <div class="pano-hit" style="left:62%;top:55%;width:15%;height:20%" onclick="setScene('garden')">
          <div class="pano-tag" style="left:50%;top:-14px">🌱 Kräuter- &amp; Blumengarten</div>
        </div>
      </div>`).join('')}
    </div>

    <div class="firefly-layer">${ffHtml}</div>

    ${o('flow')?`<div class="dc3d" style="left:17%;top:68%" onclick="hop()">${shopItem3dSvg('flow')}</div>`:''}
    ${o('pond')?`<div class="dc3d" style="left:41%;top:66%" onclick="hop()">${shopItem3dSvg('pond')}</div>`:''}
    ${o('mate')?`<div class="dc3d" style="left:33%;top:69%" onclick="hop()">${shopItem3dSvg('mate')}</div>`:''}
    ${o('baby')?`<div class="dc3d" style="left:13%;top:71%;width:54px;height:54px" onclick="hop()">${shopItem3dSvg('baby')}</div>`:''}

    <div class="qk-stage" onclick="hop()">
      <div class="qk-ground-shadow"></div>
      <div class="qk-3d-wrap" id="qk-rig">${quaki3dSvg()}${quakiWornOverlaySvg()}</div>
    </div>
  </div>`;
  bindPanoDrag();
}

function renderRoom(){
  const r=S.rooms[S.roomIdx]||S.rooms[0];
  const m=document.getElementById('m');
  m.innerHTML=`<div class="world" style="background:linear-gradient(180deg,${r.wall} 0%,#cbb89d 62%,${r.floor} 62%,#593a20 100%)">
    ${renderTop()}
    <div class="room-pill">
      <button onclick="setScene('out')">← Wald</button>

function renderGarden(){
  const m=document.getElementById('m');
  m.innerHTML=`<div class="garden-canvas" id="garden-stage">
    ${renderTop()}
    <div class="room-pill">
      <button onclick="setScene('out')">← Wald</button>
      <span>🌱 Kleiner Garten</span>

    </div>

    ${S.beds.map(b=>`<div class="bed3d" data-id="${b.id}" style="left:${b.x}%;top:${b.y}%;--bscale:${(0.85+(b.y-35)*0.004).toFixed(2)}" onclick="tapBed('${b.id}')">
      <div class="bed3d-box">
        <svg viewBox="0 0 160 110" width="100%" height="100%">
          <rect x="8" y="18" width="144" height="82" rx="22" fill="#6e4222" stroke="#9e673b" stroke-width="5"/>
          <rect x="16" y="24" width="128" height="66" rx="16" fill="${b.water?'#3b2818':'#5c432c'}"/>
        </svg>
        <div class="bed3d-crops">${b.crops.join('')}</div>
        ${b.water?'':'<span class="bed3d-water">💧 Durst</span>'}
      </div>
      <div class="bed3d-tag">${b.n}</div>
    </div>`).join('')}
  </div>`;

function setScene(sc){S.scene=sc;S.decoOpen=false;drawDecoDrawer();save();renderWorld();}
function nextRoom(){S.roomIdx=(S.roomIdx+1)%S.rooms.length;save();renderRoom();}
function hop(){
  const el=document.getElementById('qk-rig');
  if(el){el.classList.remove('hop3d');void el.offsetWidth;el.classList.add('hop3d');}
  sayNew();
}
function sayNew(){
  window._qMsg=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  const b=document.querySelector('.bubble');
  if(b)b.textContent=window._qMsg;
}

function bindPanoDrag(){
  const w=document.getElementById('world'), p=document.getElementById('pano');
  if(!w||!p)return;
  let sx=0, startX=S.panoX, drag=false;
  w.onpointerdown=e=>{if(e.target.closest('button,.qk-stage,.dc3d,.pano-hit'))return;drag=true;sx=e.clientX;startX=S.panoX;};
  w.onpointermove=e=>{if(!drag)return;const dx=e.clientX-sx;S.panoX=Math.max(-window.innerWidth*2.1,Math.min(0,startX+dx));p.style.transform=`translateX(${S.panoX}px)`;};
  w.onpointerup=()=>{if(drag){drag=false;save();}};
}
function bindFurnitureDrag(){
  const st=document.getElementById('room-stage');if(!st)return;
  st.querySelectorAll('.f3d-item').forEach(el=>{
    el.onpointerdown=e=>{
      e.stopPropagation();
      const id=el.dataset.id;
      const move=ev=>{
        const rect=st.getBoundingClientRect();
        const x=Math.max(12,Math.min(88,Math.round(((ev.clientX-rect.left)/rect.width)*100)));
        const y=Math.max(52,Math.min(88,Math.round(((ev.clientY-rect.top)/rect.height)*100)));
        el.style.left=x+'%';el.style.top=y+'%';
        const it=S.rooms[S.roomIdx].items.find(i=>i.id===id);
        if(it){it.x=x;it.y=y;}
      };
      const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);save();};
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
    };
  });
}
function bindBedDrag(){
  const st=document.getElementById('garden-stage');if(!st)return;
  st.querySelectorAll('.bed3d').forEach(el=>{
    el.onpointerdown=e=>{
      const id=el.dataset.id;let moved=false;
      const move=ev=>{
        moved=true;
        const rect=st.getBoundingClientRect();
        const x=Math.max(18,Math.min(82,Math.round(((ev.clientX-rect.left)/rect.width)*100)));
        const y=Math.max(26,Math.min(82,Math.round(((ev.clientY-rect.top)/rect.height)*100)));
        el.style.left=x+'%';el.style.top=y+'%';
        const b=S.beds.find(i=>i.id===id);if(b){b.x=x;b.y=y;}
      };
      const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);if(moved)save();};
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
    };
  });
}
function tapBed(id){
  const b=S.beds.find(x=>x.id===id);if(!b)return;
  if(!b.water){b.water=true;save();renderGarden();toast('+'+gain(2)+' ⭐ Gegossen! 💧');}
  else{toast('+'+gain(3)+' ⭐ Frische Ernte aus „'+b.n+'“! 🌿');}
}
function waterAll(){
  let c=0;S.beds.forEach(b=>{if(!b.water){b.water=true;c++;}});
  save();renderGarden();
  toast(c?`+${gain(c*2)} ⭐ Alle Beete gegossen! 💧`:'Alle Beete sind schon frisch gegossen 🌱');
}

    </button>
    <button class="dock-btn" onclick="toggleDeco()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3c634b" stroke-width="2.2"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Deko</span>
    </button>
  `;
}

const SHOP_WEAR=[
  {id:'hat',n:'Blätterhut',c:10},{id:'crown',n:'Blütenkrone',c:15},
  {id:'glass',n:'Runde Brille',c:12},{id:'scarf',n:'Kuschelschal',c:14},{id:'bag',n:'Umhängetasche',c:18}
];
const SHOP_OUT=[
  {id:'flow',n:'Blumenbeet',c:12},{id:'pond',n:'Glüh-Teich',c:25},
  {id:'mate',n:'Entenfreund',c:30},{id:'baby',n:'Kleines Küken',c:22}
];
const FURNITURE_LIST=[
  {t:'Sessel',c:15},{t:'Tisch',c:12},{t:'Bett',c:20},
  {t:'Pflanze',c:8},{t:'Lampe',c:10},{t:'Bücherregal',c:18}
];

function toggleDeco(){S.decoOpen=!S.decoOpen;drawDecoDrawer();}
function drawDecoDrawer(){
  const d=document.getElementById('deco-drawer');
  d.classList.toggle('on',!!S.decoOpen);
  d.classList.toggle('expanded',!!S.decoExpanded);
  if(!S.decoOpen){d.innerHTML='';return;}

  let grid='';
  if(S.decoTab==='furn'){
    grid=FURNITURE_LIST.map(f=>`<button class="deco-card" onclick="placeFurn('${f.t}',${f.c})">
      <div style="width:58px;height:58px">${furn3dSvg(f.t)}</div>
      <div>${f.t}</div>
      <span>⭐ ${f.c}</span>
    </button>`).join('');
  }else if(S.decoTab==='wear'){
    grid=SHOP_WEAR.map(s=>{
      const owned=S.owned.includes(s.id), worn=S.worn.includes(s.id);
      return `<button class="deco-card ${worn?'worn':owned?'owned':''}" onclick="buy('${s.id}',${s.c},true)">
        <div style="width:58px;height:58px">${shopItem3dSvg(s.id)}</div>
        <div>${s.n}</div>
        <span>${owned?(worn?'Angezogen ✓':'Anziehen'):'⭐ '+s.c}</span>
      </button>`;
    }).join('');
  }else{
    grid=SHOP_OUT.map(s=>{
      const owned=S.owned.includes(s.id);
      return `<button class="deco-card ${owned?'owned':''}" onclick="buy('${s.id}',${s.c},false)">
        <div style="width:58px;height:58px">${shopItem3dSvg(s.id)}</div>
        <div>${s.n}</div>
        <span>${owned?'Steht draußen ✓':'⭐ '+s.c}</span>
      </button>`;
    }).join('');
  }

  d.innerHTML=`
    <div class="deco-drag-bar" onclick="S.decoExpanded=!S.decoExpanded;drawDecoDrawer()"></div>
    <div class="row" style="justify-content:space-between;padding:4px 16px">
      <b>🛋️ Einrichten &amp; Outfits</b>
      <button class="rb" style="width:32px;height:32px;font-size:14px" onclick="toggleDeco()">✕</button>
    </div>
    <div class="deco-tabs">
      <button class="${S.decoTab==='furn'?'p':''}" onclick="S.decoTab='furn';drawDecoDrawer()">🪑 Möbel ins Zimmer</button>
      <button class="${S.decoTab==='wear'?'p':''}" onclick="S.decoTab='wear';drawDecoDrawer()">👒 Quaki-Outfits</button>
      <button class="${S.decoTab==='out'?'p':''}" onclick="S.decoTab='out';drawDecoDrawer()">🌸 Wald-Deko</button>
    </div>
    <div class="deco-grid">${grid}</div>
  `;
}

function placeFurn(t,cost){
  if(S.pts<cost){toast('Noch nicht genug ⭐ (du hast '+S.pts+')');return;}
  S.pts-=cost;
  S.rooms[S.roomIdx].items.push({id:'f'+Date.now(),t,x:50,y:74});
  S.scene='room';S.decoOpen=false;
  save();drawDecoDrawer();renderWorld();
  toast(t+' ins Zimmer gestellt! 🏠');
}

function buy(id,cost,isWear){
  if(S.owned.includes(id)){
    if(isWear){
      if(S.worn.includes(id))S.worn=S.worn.filter(x=>x!==id);
      else S.worn.push(id);
      save();drawDecoDrawer();renderWorld();
    }else{
      S.scene='out';S.decoOpen=false;save();drawDecoDrawer();renderWorld();
    }
    return;
  }
  if(S.pts<cost){toast('Noch nicht genug ⭐ (du hast '+S.pts+')');return;}
  S.pts-=cost;S.owned.push(id);
  if(isWear)S.worn.push(id);
  save();drawDecoDrawer();renderWorld();
  toast('Freigeschaltet! 💛');
}

function openSheet(name){
  S.curSheet=name;S.decoOpen=false;drawDecoDrawer();
  document.body.classList.add('sheet-open');
  document.getElementById('shb').classList.add('on');
  document.getElementById('sh').classList.add('on');
  const titles={today:'☀️ Dein Tag heute',day:'📅 Kalender',todo:'✅ Deine To-dos',play:'⏳ Fokus & Ruhe',shop:'⚙️ Backup & Einstellungen'};
  document.getElementById('sht').textContent=titles[name]||'Quaki';
  if(name==='today')vToday();
  else if(name==='day')vDay();
  else if(name==='todo')vTodo();
  else if(name==='play')vPlay();
  else vShop();
}
function closeS(){
  S.curSheet=null;
  document.body.classList.remove('sheet-open');
  document.getElementById('shb').classList.remove('on');
  document.getElementById('sh').classList.remove('on');
  renderDock();
}
function SC(html){document.getElementById('sc').innerHTML=html;}

function vToday(){
  const td=todayStr();
  const list=S.tasks.filter(t=>t.date===td);
  SC(`<div class="clean-hero">
    <div style="font-weight:800;font-size:17px">💛 Hallo! Schön, dass du heute da bist</div>
    <div class="mut" style="margin-top:4px">Hake ab, was du schaffst – jeder Punkt bringt ⭐ für Quaki.</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">🌱 Kleine Gewohnheiten</h2>
      <button class="g" style="padding:6px 12px;font-size:13px" onclick="openSheet('play')">⏳ Fokus-Timer</button>
    </div>
    ${S.habits.map((h,hi)=>`<div class="habit-row">
      <div style="font-weight:700">${h.n}</div>
      <div class="wdots">${h.days.map((d,di)=>`<div class="wdot ${d?'on':''}" onclick="toggleHabit(${hi},${di})">${['M','D','M','D','F','S','S'][di]}</div>`).join('')}</div>
    </div>`).join('')}
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">📋 Heute geplant (${list.length})</h2>
      <button class="p" style="padding:6px 12px;font-size:13px" onclick="quickAddTask()">+ Neu</button>
    </div>
    ${list.length?list.map(t=>`<div class="chk">
      <input type="checkbox" class="sq" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
      <div style="flex:1;${t.done?'text-decoration:line-through;opacity:.55':''}">
        <div style="font-weight:700">${t.txt}</div>
        <small class="mut">${t.time||'Tag'} · ${t.cat||'Alltag'}</small>
      </div>
    </div>`).join(''):'<div class="mut">Heute ist noch alles frei 🌿</div>'}
  </div>`);
}

function toggleHabit(hi,di){
  const h=S.habits[hi];h.days[di]=h.days[di]?0:1;
  if(h.days[di])toast('+'+gain(2)+' ⭐ Gewohnheit abgehakt!');
  save();vToday();
}

function vDay(){
  const d=new Date(S.selDate+'T12:00:00');
  const y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  let cells='';
  for(let i=0;i<startOffset;i++)cells+=`<div class="mc o"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cnt=S.tasks.filter(t=>t.date===iso).length;
    cells+=`<div class="mc ${iso===todayStr()?'td':''} ${iso===S.selDate?'sel':''}" onclick="S.selDate='${iso}';vDay()">
      <b>${day}</b>
      <div class="dts">${Array.from({length:Math.min(3,cnt)},()=>'<i></i>').join('')}</div>
    </div>`;
  }
  const dayTasks=S.tasks.filter(t=>t.date===S.selDate);
  SC(`<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <button onclick="shiftMonth(-1)">◀</button>
      <b style="font-size:17px">${monthNames[m]} ${y}</b>
      <button onclick="shiftMonth(1)">▶</button>
    </div>
    <div class="mg" style="margin-bottom:6px">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="mh">${x}</div>`).join('')}</div>
    <div class="mg">${cells}</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">📌 ${S.selDate.split('-').reverse().join('.')}</h2>
      <button class="p" style="padding:6px 12px;font-size:13px" onclick="quickAddTask('${S.selDate}')">+ Termin</button>
    </div>
    ${dayTasks.length?dayTasks.map(t=>`<div class="chk">
      <input type="checkbox" class="sq" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
      <div style="flex:1"><b>${t.txt}</b><div class="mut">${t.time||'Ganztägig'}</div></div>
    </div>`).join(''):'<div class="mut">Keine Einträge an diesem Tag 🌱</div>'}
  </div>`);
}
function shiftMonth(delta){
  const d=new Date(S.selDate+'T12:00:00');
  d.setMonth(d.getMonth()+delta);
  S.selDate=d.toISOString().slice(0,10);vDay();
}

function vTodo(){
  SC(`<div class="row" style="margin-bottom:12px">
    <input id="new-td" placeholder="Neues To-do eingeben …" style="flex:1" onkeydown="if(event.key==='Enter')addTodoInline()">
    <button class="p" onclick="addTodoInline()">+ Hinzufügen</button>
  </div>
  <div class="card">
    <h2>Offen (${S.tasks.filter(t=>!t.done).length})</h2>
    ${S.tasks.filter(t=>!t.done).map(t=>`<div class="chk">
      <input type="checkbox" class="sq" onchange="toggleTask('${t.id}')">
      <div style="flex:1"><b>${t.txt}</b><div class="mut">${t.date.split('-').reverse().join('.')} ${t.time?'· '+t.time:''}</div></div>
      <button class="x" onclick="delTask('${t.id}')">✕</button>
    </div>`).join('')||'<div class="mut">Alles erledigt! 🎉</div>'}
  </div>
  <div class="card">
    <h2>Erledigt (${S.tasks.filter(t=>t.done).length})</h2>
    ${S.tasks.filter(t=>t.done).map(t=>`<div class="chk" style="opacity:.6">
      <input type="checkbox" class="sq" checked onchange="toggleTask('${t.id}')">
      <div style="flex:1;text-decoration:line-through">${t.txt}</div>
      <button class="x" onclick="delTask('${t.id}')">✕</button>
    </div>`).join('')||'<div class="mut">Noch nichts abgehakt</div>'}
  </div>`);
}
function addTodoInline(){
  const inp=document.getElementById('new-td');if(!inp||!inp.value.trim())return;
  S.tasks.unshift({id:'t'+Date.now(),txt:inp.value.trim(),done:false,date:todayStr(),time:'',cat:'Alltag'});
  save();renderDock();vTodo();toast('To-do hinzugefügt 🌱');
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done)toast('+'+gain(5)+' ⭐ Geschafft! 💛');
  save();renderDock();
  if(S.curSheet==='today')vToday();
  else if(S.curSheet==='day')vDay();
  else if(S.curSheet==='todo')vTodo();
}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();renderDock();vTodo();}

function vPlay(){
  const games=[
    ['⏱️','Fokus-Timer (25 Min)','Ruhig an einer Sache bleiben – gibt ⭐ +15','startFocus(25)'],
    ['⚡','Mini-Sprint (5 Min)','Nur 5 Minuten anfangen – ideal gegen Aufschieben','startFocus(5)'],
    ['🌬️','Atem-Insel','4 Sekunden ein, 4 Sekunden aus – kurz durchatmen','openBreathe()'],
    ['🌿','Moos-Memo','Kleines Gedächtnisspiel für zwischendurch','openMemo()']
  ];
  SC(`<div class="clean-hero">
    <div style="font-weight:800;font-size:17px">⏳ Fokus &amp; ruhige Pausen</div>
    <div class="mut" style="margin-top:4px">Kurze Einheiten, kein Druck – Quaki passt auf die Zeit auf 💛</div>
  </div>
  ${games.map(g=>`<div class="card" style="cursor:pointer" onclick="${g[3]}">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:12px">
        <div style="font-size:32px">${g[0]}</div>
        <div><div style="font-weight:800;font-size:16px">${g[1]}</div><div class="mut">${g[2]}</div></div>
      </div>
      <span style="font-weight:800;color:#3c634b">Start →</span>
    </div>
  </div>`).join('')}`);
}
function startFocus(mins){
  let left=mins*60;
  const iv=setInterval(()=>{
    left--;
    const el=document.getElementById('ftm');
    if(!el){clearInterval(iv);return;}
    if(left<=0){clearInterval(iv);ov();toast('+'+gain(mins>=20?15:5)+' ⭐ Fokus geschafft! 💛');return;}
    el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  },1000);
  ov(`<h2>⏳ Fokus-Zeit (${mins} Min)</h2>
    <div class="breathe"></div>
    <div id="ftm" style="font-size:42px;font-weight:800;margin:10px 0">${String(mins).padStart(2,'0')}:00</div>
    <p class="mut">Kein Stress – ein Schritt nach dem anderen 🌱</p>
    <button class="wide" onclick="clearInterval(${iv});ov()">Beenden</button>`);
}
function openBreathe(){
  ov(`<h2>🌬️ Atem-Insel</h2>
    <div class="breathe"></div>
    <p style="font-weight:700">Atme mit dem goldenen Licht ein … und langsam wieder aus 🌿</p>
    <button class="p wide" onclick="ov();toast('+'+gain(3)+' ⭐ Gut durchgeatmet 💛')">Fertig</button>`);
}
function openMemo(){
  const syms=['🍄','🌿','🌸','🍓','🌙','⭐'];
  const cards=[...syms,...syms].sort(()=>Math.random()-.5).map((e,i)=>({i,e,open:false,done:false}));
  let sel=[];
  window._memoFlip=idx=>{
    const c=cards[idx];if(c.open||c.done||sel.length>=2)return;
    c.open=true;sel.push(c);drawM();
    if(sel.length==2){
      setTimeout(()=>{
        if(sel[0].e===sel[1].e){sel[0].done=sel[1].done=true;}
        else{sel[0].open=sel[1].open=false;}
        sel=[];drawM();
        if(cards.every(x=>x.done)){setTimeout(()=>{ov();toast('+'+gain(8)+' ⭐ Alle Paare gefunden! 🌿')},350);}
      },550);
    }
  };
  function drawM(){
    ov(`<h2>🌿 Moos-Memo</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0">
        ${cards.map(c=>`<button style="height:56px;font-size:26px;padding:0;border-radius:16px;background:${c.done?'#cdebd8':c.open?'#fff':'#3c634b'};color:#fff" onclick="_memoFlip(${c.i})">${c.open||c.done?c.e:'🌱'}</button>`).join('')}
      </div>
      <button class="wide" onclick="ov()">Schließen</button>`);
  }
  drawM();
}

function vShop(){
  SC(`<div class="card">
    <h2>💾 Spielstand sichern &amp; laden</h2>
    <p class="mut">Deine Daten bleiben lokal auf deinem Gerät gespeichert. Hier kannst du sie jederzeit als Datei sichern.</p>
    <div class="row">
      <button class="g" style="flex:1" onclick="exportBackup()">⬇️ Backup speichern</button>
      <button style="flex:1" onclick="document.getElementById('inp-backup').click()">⬆️ Backup laden</button>
    </div>
  </div>
  <div class="card">
    <h2>✨ Alle Outfits &amp; Wald-Deko</h2>
    ${[...SHOP_WEAR,...SHOP_OUT].map(s=>{
      const owned=S.owned.includes(s.id);
      return `<div class="chk">
        <div style="width:44px;height:44px;flex:none">${shopItem3dSvg(s.id)}</div>
        <div style="flex:1;font-weight:700">${s.n}</div>
        <button class="${owned?'g':'y'}" onclick="buy('${s.id}',${s.c},${SHOP_WEAR.some(w=>w.id===s.id)});vShop()">${owned?'Besitzt ✓':'⭐ '+s.c}</button>
      </div>`;
    }).join('')}
  </div>`);
}
function exportBackup(){
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));
  a.download='quaki-backup-'+todayStr()+'.json';
  a.click();
}
function importBackupFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{S=Object.assign(structuredClone(DEFAULT_STATE),JSON.parse(r.result));save();renderWorld();renderDock();vShop();toast('Backup geladen! 💛');}
    catch(e){toast('Datei konnte nicht gelesen werden');}
  };
  r.readAsText(file);
}

function addMenu(){
  ov(`<h2>✨ Was möchtest du tun?</h2>
    <div class="am">
      <button onclick="ov();quickAddTask()">✅ Neue Aufgabe / Termin eintragen</button>
      <button onclick="ov();openSheet('play')">⏳ Fokus-Timer oder Atem-Pause starten</button>
      <button onclick="ov();toggleDeco()">🛋️ Zimmer einrichten &amp; Quaki anziehen</button>
      <button onclick="ov();setScene('garden')">🌱 Zum Kräuter- &amp; Blumengarten gehen</button>
    </div>`);
}
function quickAddTask(dateIso){
  const dt=dateIso||todayStr();
  ov(`<h2>✅ Neuer Eintrag</h2>
    <input id="qt-txt" placeholder="Was steht an?" style="width:100%;margin-bottom:8px">
    <div class="row" style="margin-bottom:8px">
      <input id="qt-date" type="date" value="${dt}" style="flex:1">
      <input id="qt-time" type="time" style="width:120px">
    </div>
    <button class="p wide" onclick="saveQuickTask()">Speichern</button>`);
}
function saveQuickTask(){
  const txt=document.getElementById('qt-txt').value.trim();
  if(!txt)return;
  const date=document.getElementById('qt-date').value||todayStr();
  const time=document.getElementById('qt-time').value||'';
  S.tasks.unshift({id:'t'+Date.now(),txt,done:false,date,time,cat:'Alltag'});
  save();ov();renderDock();
  if(S.curSheet==='today')vToday();
  else if(S.curSheet==='day')vDay();
  else if(S.curSheet==='todo')vTodo();
  toast('Gespeichert! 🌱');
}

renderWorld();
renderDock();
</script>
</body></html>
