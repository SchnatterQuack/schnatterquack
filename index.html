<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3529"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quaki">
<title>Quaki – dein Zuhause für gute Tage</title>
<style>
:root{
  --bg:#f4efe4; --card:#fffdf8; --ink:#3f332c; --mut:#7d6e63;
  --pink:#ee96ad; --mint:#94cca9; --sun:#f5cf64; --lav:#c5b7eb; --line:#e5dbc8;
  --moss-deep:#192e22; --moss-mid:#2c4a38; --moss-light:#5c8549;
  color-scheme:light; box-sizing:border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--moss-deep);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
button:active{transform:scale(.96)}
button.p{background:linear-gradient(180deg,#ffadc2,#e87f9b);color:#4f1626;font-weight:700;box-shadow:0 4px 12px rgba(232,127,155,.35)}
button.y{background:linear-gradient(180deg,#ffe48f,#f0c248);color:#473100;font-weight:800;box-shadow:0 4px 12px rgba(240,194,72,.35)}
button.g{background:linear-gradient(180deg,#3c634b,#284533);color:#fff8e8;font-weight:700}
button.rb{width:40px;height:40px;padding:0;font-size:17px;background:rgba(255,253,248,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(25,35,28,.18);border:1.5px solid rgba(255,255,255,.85)}
button.wide{width:100%;margin-top:10px}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:20px;padding:9px 14px;min-width:0}
input,select{border-radius:999px}
.card{background:rgba(255,253,248,.94);border:1.5px solid rgba(255,255,255,.92);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(45,38,28,.09)}
.card h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:14px}

/* 360°-Welt */
.world{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;background:linear-gradient(180deg,#1a3325 0%,#2d5239 58%,#1e3a24 100%)}
.world::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 65px rgba(10,20,14,.45)}
.pano-track{position:absolute;top:0;bottom:0;left:0;width:960vw;display:flex;will-change:transform;z-index:1}
.pano-tile{width:320vw;height:100%;flex:none;position:relative}
.pano-hit{position:absolute;cursor:pointer;z-index:4;border-radius:28px}
.pano-tag{position:absolute;transform:translateX(-50%);background:rgba(34,54,42,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,245,200,.45);padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;color:#fff8e6;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}

/* Glühwürmchen */
.firefly-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6b3;box-shadow:0 0 10px 3px rgba(255,240,150,.85);animation:ffFloat 6s ease-in-out infinite}
@keyframes ffFloat{0%,100%{transform:translate(0,0) scale(.8);opacity:.35}50%{transform:translate(12px,-18px) scale(1.2);opacity:1}}

/* Topbar & HUD */
.tb{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.lv{background:rgba(255,253,248,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;border-radius:20px;padding:5px 12px;font-size:12.5px;box-shadow:0 4px 14px rgba(20,30,24,.18)}
.mini{height:5px;background:rgba(63,51,44,.14);border-radius:4px;margin-top:3px;width:78px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4e8232);border-radius:4px}
.pts{background:linear-gradient(180deg,#ffe89e,#f2c64d);border:1.5px solid #fff;color:#473100;border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(20,30,24,.2)}

.room-pill{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(36,48,38,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,245,215,.4);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:#fff7e6;z-index:8;white-space:nowrap}
.room-pill button{padding:2px 6px;font-size:12px;background:transparent;color:#ffe48f;font-weight:800}

.bubble{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(255,253,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;border-radius:22px;padding:8px 16px;font-weight:800;font-size:13px;box-shadow:0 8px 20px rgba(20,30,24,.22);max-width:84%;text-align:center;line-height:1.3;z-index:7;cursor:pointer}
.bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0;border-style:solid;border-color:rgba(255,253,248,.95) transparent transparent}

/* Quaki 3D-Bühne */
.qk-stage{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:clamp(130px,22vh,165px);height:clamp(142px,24vh,180px);z-index:5;cursor:pointer;touch-action:manipulation;perspective:750px}
.qk-ground-shadow{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:96px;height:18px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(10,20,10,.65) 0%,rgba(10,20,10,0) 76%);pointer-events:none;z-index:1}
.qk-3d-wrap{position:relative;z-index:2;width:100%;height:100%;transform-origin:50% 94%;animation:qk3dIdle 4.2s ease-in-out infinite}
@keyframes qk3dIdle{0%,100%{transform:rotateY(-3deg) translateY(0)}50%{transform:rotateY(3deg) translateY(-4px)}}
@keyframes qk3dHop{0%{transform:translateY(0) scale(1)}25%{transform:translateY(6px) scale(1.08,.9)}55%{transform:translateY(-26px) scale(.95,1.06)}100%{transform:translateY(0) scale(1)}}
.qk-3d-wrap.hop3d{animation:qk3dHop .65s cubic-bezier(.25,.9,.35,1.2)!important}
.qk-wear-layer{position:absolute;inset:0;pointer-events:none;z-index:3}

/* 3D Möbel & Draußen-Deko */
.f3d-item{position:absolute;transform:translate(-50%,-86%) scale(var(--dscale,1));cursor:grab;display:flex;flex-direction:column;align-items:center;z-index:4}
.f3d-item:active{cursor:grabbing;z-index:25!important}
.f3d-model{width:88px;height:88px;filter:drop-shadow(0 10px 8px rgba(18,12,8,.45));pointer-events:none}
.dc3d{position:absolute;width:68px;height:68px;transform:translate(-50%,-50%);cursor:pointer;z-index:4;filter:drop-shadow(0 8px 10px rgba(12,24,14,.5));transition:transform .2s}
.dc3d:active{transform:translate(-50%,-58%) scale(1.12)}

/* Garten-Beete */
.garden-canvas{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#426b36 0%,#264521 60%,#182e16 100%);overflow:hidden;user-select:none;touch-action:none}
.bed3d{position:absolute;transform:translate(-50%,-50%) scale(var(--bscale,1));cursor:grab;z-index:4;display:flex;flex-direction:column;align-items:center}
.bed3d:active{cursor:grabbing;z-index:15}
.bed3d-box{position:relative;width:152px;height:106px;pointer-events:none}
.bed3d-crops{position:absolute;inset:10px 14px 22px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;font-size:26px;line-height:1}
.bed3d-tag{margin-top:-6px;background:rgba(30,48,36,.88);border:1px solid rgba(255,245,200,.45);color:#fff8e6;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;white-space:nowrap}
.bed3d-water{position:absolute;top:-4px;right:2px;background:#2997ff;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}

/* Dock Leiste */
.dock{position:fixed;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-around;z-index:17;pointer-events:none;max-width:480px;margin:0 auto}
.dock button{pointer-events:auto}
body.sheet-open .dock,body.sheet-open .deco-drawer{opacity:0!important;pointer-events:none!important;transform:translateY(120%)!important}
.plus{width:60px;height:60px;border-radius:50%;padding:0;font-size:32px;background:linear-gradient(180deg,#ffadc2,#e87896);color:#fff;box-shadow:0 8px 20px rgba(180,60,95,.45),inset 0 2px 0 rgba(255,255,255,.7);flex:none}
.dock-btn{width:52px;height:52px;border-radius:18px;padding:3px 0;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;box-shadow:0 6px 16px rgba(20,30,24,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.dock-btn span{font-size:9px;font-weight:800;color:var(--ink);margin-top:2px}
.dock-btn i{position:absolute;top:-4px;right:-4px;background:#ff5c7c;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

/* Einrichtungs-Schublade */
.deco-drawer{position:fixed;left:0;right:0;bottom:0;height:64%;max-height:92%;background:linear-gradient(180deg,#faf5ea 0%,#efe5d3 100%);border-radius:30px 30px 0 0;border-top:2px solid #fff;z-index:19;box-shadow:0 -10px 30px rgba(25,20,15,.28);display:flex;flex-direction:column;max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),height .28s;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
.deco-drawer.on{transform:none}
.deco-drawer.expanded{height:92%;padding-bottom:24px}
.deco-drag-bar{width:48px;height:5px;border-radius:999px;background:#cbbba8;margin:8px auto 2px;cursor:ns-resize}
.deco-tabs{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.deco-tabs button{flex:none;padding:7px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}
.deco-grid{flex:1;overflow:auto;padding:12px 16px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.deco-card{background:rgba(255,253,248,.95);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(60,45,30,.08)}
.deco-card.owned{border-color:var(--mint);background:#f2faf5}
.deco-card.worn{border-color:var(--pink);background:#fff0f4}

/* Vollbild-Sheets im Mossy-Design */
.shb{position:fixed;inset:0;background:rgba(25,20,15,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:14}.shb.on{opacity:1;pointer-events:auto}
.sh{position:fixed;inset:0;height:100%;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:radial-gradient(circle at 15% 10%,rgba(168,214,122,.22),transparent 45%),linear-gradient(180deg,#f3ecde 0%,#e7dcc8 100%);z-index:16;display:flex;flex-direction:column}
.sh.on{transform:none}
.sht{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(180deg,#2d4737 0%,#213629 100%);color:#fff8e8;font-size:20px;font-weight:800;border-bottom:2px solid rgba(255,245,200,.25)}
.sht .rb{width:auto;padding:0 14px;height:36px;font-size:13.5px;font-weight:800;background:rgba(255,253,248,.94);color:#263b2e}
#sc{overflow:auto;max-width:580px;width:100%;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px));flex:1}

/* UI Bausteine */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:linear-gradient(180deg,#cdebd8,#9fd1b2);color:#163d29;font-weight:700;border:1px solid rgba(255,255,255,.8)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(229,219,200,.5)}
.chk:last-child{border-bottom:0}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--pink);background:#fff;padding:0;flex:none;font-size:16px;line-height:1;color:#fff}.dot.on{background:var(--pink)}
.sq{width:22px;height:22px;accent-color:#4e8232;flex:none}
.seg{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,253,248,.75);padding:5px;border-radius:999px;border:1.5px solid rgba(255,255,255,.9)}
.seg button{flex:1;background:transparent;font-weight:800;font-size:13.5px;padding:8px 12px}
.seg button.p{background:linear-gradient(180deg,#3c634b,#284533)!important;color:#fff8e8!important;box-shadow:0 4px 10px rgba(32,56,41,.28)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.mc{min-height:54px;background:rgba(255,253,248,.92);border-radius:16px;padding:5px;text-align:center;font-size:14px;cursor:pointer;border:1.5px solid rgba(255,255,255,.9)}
.mc.td{outline:2.5px solid #5c9442;background:#f4faef}
.mc.sel{background:linear-gradient(180deg,#ffe799,#f2c955);color:#3f2b00;font-weight:800}
.mc.o{opacity:.35}
.dts{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:3px}.dts i{width:7px;height:7px;border-radius:50%;background:#5c9442}
.clean-hero{background:linear-gradient(135deg,#d8f2e5,#fff0c2);border-radius:24px;padding:16px;margin-bottom:14px;border:1.5px solid #fff}
.habit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.habit-row:last-child{border-bottom:0}
.wdots{display:flex;gap:4px}.wdot{width:15px;height:15px;border-radius:50%;background:var(--line);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--mut)}.wdot.on{background:#8ec9a4;color:#17422d;font-weight:800}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(16,26,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.ov>div{background:linear-gradient(180deg,#fbf7ee 0%,#f0e6d4 100%);border:2px solid rgba(255,255,255,.92);border-radius:30px;padding:22px 20px;width:100%;max-width:400px;max-height:88%;overflow:auto;text-align:center;box-shadow:0 24px 48px rgba(14,24,18,.42)}
.ov h2{color:#263b2e;margin-top:0}
.am{display:grid;gap:8px}.am button{text-align:left;padding:14px 18px;background:rgba(255,253,248,.92)}
.breathe{width:90px;height:90px;border-radius:50%;background:var(--sun);margin:14px auto;animation:br 8s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#263b2e;color:#fff8e8;padding:10px 18px;border-radius:999px;z-index:30;font-weight:700;max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.28)}
</style></head><body>
<main id="m"></main>
<div class="dock" id="dock"></div>
<div class="deco-drawer" id="deco-drawer"></div>
<div class="shb" id="shb" onclick="closeS()"></div>
<div class="sh" id="sh"><div class="sht"><span id="sht"></span><button class="rb" onclick="closeS()">← Zurück</button></div><div id="sc"></div></div>
<div id="ov"></div><div id="ts"></div>
<input type="file" id="inp-backup" accept=".json,.txt,application/json" style="display:none" onchange="importBackupFile(this.files[0])">
<script>
const KEY='quaki_mossy_v5';
const todayStr=()=>new Date().toISOString().slice(0,10);

const DEFAULT_STATE={
  pts:45, xp:120, lv:2,
  scene:'out', // 'out' | 'room' | 'garden'
  roomIdx:0,
  panoX:0,
  decoOpen:false, decoExpanded:false, decoTab:'furn',
  owned:['hat','flow','mate'],
  worn:['hat'],
  rooms:[
    {name:'Wohnzimmer',wall:'#e9dcc4',floor:'#8c6239',items:[
      {id:'f1',t:'Sessel',x:28,y:74},{id:'f2',t:'Tisch',x:52,y:78},{id:'f3',t:'Pflanze',x:78,y:70}
    ]},
    {name:'Schlafzimmer',wall:'#dce4d4',floor:'#7a5434',items:[
      {id:'f4',t:'Bett',x:35,y:74},{id:'f5',t:'Lampe',x:72,y:68}
    ]}
  ],
  beds:[
    {id:'b1',n:'Kräuter-Beet',x:30,y:44,crops:['🌿','🌱','🌼'],water:true},
    {id:'b2',n:'Beeren-Ecke',x:68,y:52,crops:['🍓','🫐','🍓'],water:false},
    {id:'b3',n:'Blumen-Insel',x:48,y:72,crops:['🌸','🌻','🌷'],water:true}
  ],
  tasks:[
    {id:'t1',txt:'1 Glas Wasser trinken',done:true,date:todayStr(),time:'09:00',cat:'Alltag'},
    {id:'t2',txt:'10 Min frische Luft schnappen',done:false,date:todayStr(),time:'14:30',cat:'Wohlbefinden'},
    {id:'t3',txt:'Lieblingsmusik anmachen',done:false,date:todayStr(),time:'18:00',cat:'Pause'}
  ],
  habits:[
    {id:'h1',n:'Wasser getrunken 💧',days:[1,1,1,1,0,1,0]},
    {id:'h2',n:'Kurz bewegt 🌿',days:[1,0,1,1,1,0,0]},
    {id:'h3',n:'Pausen gegönnt 💛',days:[1,1,0,1,1,1,0]}
  ],
  calTab:'day', selDate:todayStr(), curSheet:null
};

let S=loadState();
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE),JSON.parse(raw));
  }catch(e){return structuredClone(DEFAULT_STATE);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function gain(n){
  S.pts+=n; S.xp+=n*10;
  while(S.xp>=S.lv*100){S.xp-=S.lv*100;S.lv++;}
  save(); renderTop();
  return n;
}
function toast(msg){
  const el=document.getElementById('ts');
  el.innerHTML=`<div class="toast">${msg}</div>`;
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>el.innerHTML='',2600);
}
function ov(html){
  const el=document.getElementById('ov');
  el.innerHTML=html?`<div class="ov" onclick="if(event.target===this)ov()"><div>${html}</div></div>`:'';
}

/* --------- 3D SVG-Grafiken (Quaki, Outfits, Möbel, Wald & Draußen-Deko) --------- */
function quaki3dSvg(){
  return `<svg viewBox="0 0 200 220" width="100%" height="100%" style="overflow:visible">
    <defs>
      <radialGradient id="qBody" cx="38%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff8c9"/><stop offset="55%" stop-color="#f7d560"/><stop offset="100%" stop-color="#d49e2a"/>
      </radialGradient>
      <radialGradient id="qBeak" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffb86c"/><stop offset="100%" stop-color="#e06d24"/>
      </radialGradient>
      <radialGradient id="qCheek" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff8fa8" stop-opacity="0.75"/><stop offset="100%" stop-color="#ff8fa8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Füßchen -->
    <ellipse cx="78" cy="202" rx="18" ry="8" fill="#e67e22"/>
    <ellipse cx="122" cy="202" rx="18" ry="8" fill="#e67e22"/>
    <!-- Körper -->
    <ellipse cx="100" cy="148" rx="54" ry="52" fill="url(#qBody)"/>
    <ellipse cx="100" cy="154" rx="36" ry="34" fill="#fffbe0" opacity="0.55"/>
    <!-- Flügel -->
    <ellipse cx="46" cy="146" rx="15" ry="28" transform="rotate(14 46 146)" fill="#ecc146"/>
    <ellipse cx="154" cy="146" rx="15" ry="28" transform="rotate(-14 154 146)" fill="#ecc146"/>
    <!-- Kopf -->
    <circle cx="100" cy="78" r="44" fill="url(#qBody)"/>
    <!-- Haarschopf -->
    <path d="M96 34 Q90 18 102 24 Q112 16 108 35" fill="#f7d560" stroke="#d49e2a" stroke-width="2"/>
    <!-- Augen -->
    <circle cx="82" cy="74" r="6.5" fill="#2b211a"/><circle cx="80" cy="72" r="2.2" fill="#fff"/>
    <circle cx="118" cy="74" r="6.5" fill="#2b211a"/><circle cx="116" cy="72" r="2.2" fill="#fff"/>
    <!-- Bäckchen -->
    <circle cx="68" cy="86" r="10" fill="url(#qCheek)"/>
    <circle cx="132" cy="86" r="10" fill="url(#qCheek)"/>
    <!-- Schnabel -->
    <ellipse cx="100" cy="88" rx="16" ry="9" fill="url(#qBeak)"/>
    <path d="M88 88 Q100 94 112 88" stroke="#b54d12" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}
